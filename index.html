<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tekstwolk — verzin je eigen strip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EC;
    --ink:#1A1A1A;
    --red:#E63946;
    --yellow:#FFD23F;
    --blue:#1D3557;
    --teal:#2A9D8F;
    --panel:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle, rgba(26,26,26,0.06) 1.4px, transparent 1.4px);
    background-size:20px 20px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{width:100%;max-width:640px;}

  header{text-align:center;margin-bottom:22px;}
  header h1{
    font-family:'Permanent Marker',cursive;
    font-size:clamp(2.1rem,7vw,2.8rem);
    color:var(--ink);
    margin:0 0 6px;
    letter-spacing:0.5px;
    transform:rotate(-1.2deg);
  }
  header h1 span{color:var(--red);}
  header p{margin:0;font-size:0.98rem;color:#444;max-width:480px;margin:0 auto;}

  .panel{
    background:var(--panel);
    border:3px solid var(--ink);
    border-radius:16px;
    box-shadow:6px 6px 0 var(--ink);
    padding:18px;
    margin-bottom:22px;
  }

  .scene-title{
    font-family:'Permanent Marker',cursive;
    font-size:1.15rem;
    margin:0 0 12px;
    color:var(--blue);
  }

  .scene-frame{
    border:3px solid var(--ink);
    border-radius:12px;
    overflow:hidden;
    background:#eee;
    line-height:0;
  }
  .scene-frame svg{width:100%;height:auto;display:block;}

  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
  .chip{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.85rem;
    padding:7px 14px;
    border-radius:999px;
    border:2px solid var(--ink);
    background:var(--paper);
    cursor:pointer;
    transition:transform .12s ease;
  }
  .chip:hover{transform:translateY(-2px);}
  .chip.active{background:var(--yellow);}

  label.field-label{
    display:block;
    font-weight:700;
    font-size:0.82rem;
    text-transform:none;
    margin:14px 0 6px;
    color:var(--blue);
  }

  textarea{
    width:100%;
    resize:none;
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    padding:10px 12px;
    border:2px solid var(--ink);
    border-radius:10px;
    min-height:56px;
    background:#fffdf7;
  }
  textarea:focus{outline:3px solid var(--teal);outline-offset:1px;}

  button{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:0.92rem;
    padding:11px 18px;
    border:2.5px solid var(--ink);
    border-radius:10px;
    background:var(--paper);
    cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
  button:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}

  button.primary{background:var(--red);color:#fff;}
  button.secondary{background:var(--yellow);}
  button.ghost{background:var(--panel);}
  button.wide{flex:1 1 auto;}

  .actions{margin-top:18px;}
  .actions .row{margin-top:8px;}

  .hint{font-size:0.8rem;color:#555;margin-top:8px;}

  footer{text-align:center;font-size:0.78rem;color:#666;margin-top:8px;}
  footer a{color:var(--blue);}

  @media (max-width:420px){
    .panel{padding:14px;}
    button{font-size:0.86rem;padding:10px 14px;}
  }

  .chip.sex{color:#c1121f;border-color:#c1121f;display:inline-flex;align-items:center;gap:6px;}
  .chip.sex svg{width:14px;height:14px;flex:none;}
  .gate{position:fixed;inset:0;background:rgba(26,26,26,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .gate[hidden]{display:none;}
  .gate-box{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:22px;max-width:380px;width:100%;text-align:center;}
  .gate-box p{font-size:1.2rem;font-weight:700;margin:0 0 18px;line-height:1.3;}
  .gate-box .row{justify-content:center;margin-top:0;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>even <span>niks</span></h1>
    <p>Druk op een knop of vul zelf wat in. Of niet. En verstuur. Of niet.</p>
  </header>

  <div class="panel">
    <p class="scene-title" id="scene-title"></p>
    <div class="scene-frame" id="scene-frame"></div>

    <div class="row">
      <button class="ghost wide" id="btn-new-scene">🔀 Ander plaatje</button>
      <button class="secondary wide" id="btn-random-text">✨ Verzin tekst</button>
    </div>

    <label class="field-label" for="theme-chips">Categorie voor de uitspraak</label>
    <div class="chips" id="theme-chips"></div>

    <div id="bubble-fields"></div>

    <div class="actions">
      <div class="row">
        <button class="primary wide" id="btn-download">⬇️ Download afbeelding</button>
        <button class="ghost wide" id="btn-share">📤 Verstuur</button>
      </div>
      <p class="hint">Alle teksten zijn ontworpen door de hersenen van Ari Dijxtra (niet te verwarren met Arie Dijkstra). Dus lees op eigen risico.</p>
    </div>
  </div>

  <footer>
    Disclaimer: Het leven is eindig; of was het nou oneindig? Nou ja.
  </footer>

</div>

<div class="gate" id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-q">
  <div class="gate-box"><p id="gate-q"></p><div class="row" id="gate-btns"></div></div>
</div>

function person(o){
  const cx=o.cx, cy=o.cy, shirt=o.shirt, skin=o.skin||"#f2c9a0",
        pose=o.pose||"stand", scale=o.scale||1, mirror=o.mirror?-1:1,
        hair=o.hair||"#3a2a1a";
  if(pose==="lie"){
    return `<g transform="translate(${cx},${cy}) scale(${mirror*scale},${scale})">
      <ellipse cx="75" cy="14" rx="95" ry="30" fill="${shirt}" stroke="#1a1a1a" stroke-width="5"/>
      <circle cx="0" cy="0" r="32" fill="${skin}" stroke="#1a1a1a" stroke-width="5"/>
      <path d="M-28,-14 Q0,-40 28,-14" fill="${hair}" stroke="#1a1a1a" stroke-width="4"/>

      <path d="M-7,9 Q0,13 7,9" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>`;
  }
  if(pose==="sit"){
    return `<g transform="translate(${cx},${cy}) scale(${mirror*scale},${scale})">
      <path d="M-38,50 Q0,32 38,50 L44,150 Q0,164 -44,150 Z" fill="${shirt}" stroke="#1a1a1a" stroke-width="5"/>

      <path d="M-8,10 Q0,15 8,10" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>`;
  }
  return `<g transform="translate(${cx},${cy}) scale(${mirror*scale},${scale})">
    <ellipse cx="0" cy="216" rx="50" ry="12" fill="rgba(0,0,0,.15)"/>
    <path d="M-16,150 L-22,214 M16,150 L22,214" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
    <path d="M-40,55 Q0,38 40,55 L46,155 Q0,170 -46,155 Z" fill="${shirt}" stroke="#1a1a1a" stroke-width="5"/>

    <circle cx="-10" cy="-2" r="3.2" fill="#1a1a1a"/><circle cx="10" cy="-2" r="3.2" fill="#1a1a1a"/>

}

/* ---------------------------------------------------------
   SPEECH BUBBLE PATH (rounded rect + staart)
--------------------------------------------------------- */
function bubblePath(b){
  const {x,y,w,h,tailFrac,tail} = b, r=20, half=16;
  const tailBaseX = x + w*tailFrac;
  const b1 = Math.max(x+r, tailBaseX-half);
  const b2 = Math.min(x+w-r, tailBaseX+half);
  return `M${x+r},${y} L${x+w-r},${y} A${r},${r} 0 0 1 ${x+w},${y+r} L${x+w},${y+h-r} A${r},${r} 0 0 1 ${x+w-r},${y+h}
    L${b2},${y+h} L${tail.x},${tail.y} L${b1},${y+h} L${x+r},${y+h} A${r},${r} 0 0 1 ${x},${y+h-r} L${x},${y+r} A${r},${r} 0 0 1 ${x+r},${y} Z`;
}
function bubbleGroup(b, idx){
  const pad=16, cx=b.x+b.w/2;
  return `<g>
    <path d="${bubblePath(b)}" fill="#ffffff" stroke="#1a1a1a" stroke-width="5"/>
    <text class="bubble-text" data-i="${idx}" data-x="${b.x+pad}" data-y="${b.y+pad}" data-w="${b.w-pad*2}" data-h="${b.h-pad*2}" data-cx="${cx}"
      font-family='${BUBBLE_FONT}' font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle"></text>
  </g>`;
}

/* ---------------------------------------------------------
   TEKST PASSEND MAKEN (wrap + auto-verkleinen)
--------------------------------------------------------- */
const measureCanvas = document.createElement("canvas");
const mctx = measureCanvas.getContext("2d");

function wrapText(text, maxWidth){
  const words = text.split(/\s+/).filter(Boolean);
  const lines=[]; let line="";
  for(const word of words){
    const test = line ? line+" "+word : word;
    if(mctx.measureText(test).width<=maxWidth){ line=test; continue; }
    if(line) lines.push(line);
    if(mctx.measureText(word).width>maxWidth){
      let chunk="";
      for(const ch of word){
        const t2=chunk+ch;
        if(mctx.measureText(t2).width>maxWidth && chunk){ lines.push(chunk); chunk=ch; } else chunk=t2;
      }
      line=chunk;
    } else {
      line=word;
    }
  }
  if(line) lines.push(line);
  return lines.length?lines:[""];
}

function fitText(text, maxW, maxH, maxFont, minFont){
  for(let fs=maxFont; fs>=minFont; fs--){
    mctx.font = `bold ${fs}px ${BUBBLE_FONT}`;
    const lines = wrapText(text, maxW);
    const lineHeight = fs*1.22;
    if(lines.length*lineHeight<=maxH) return {lines, fontSize:fs, lineHeight};
  }
  mctx.font = `bold ${minFont}px ${BUBBLE_FONT}`;
  let lines = wrapText(text, maxW);
  const lineHeight = minFont*1.22;
  const maxLines = Math.max(1, Math.floor(maxH/lineHeight));
  if(lines.length>maxLines){
    lines = lines.slice(0,maxLines);
    let last = lines[maxLines-1];
    while(mctx.measureText(last+"…").width>maxW && last.length>1){ last=last.slice(0,-1); }
    lines[maxLines-1]=last+"…";
  }
  return {lines, fontSize:minFont, lineHeight};
}

function renderBubbleText(textEl, text){
  while(textEl.firstChild) textEl.removeChild(textEl.firstChild);
  const x=+textEl.dataset.x, y=+textEl.dataset.y, w=+textEl.dataset.w, h=+textEl.dataset.h, cx=+textEl.dataset.cx;
  const {lines, fontSize, lineHeight} = fitText(text||"", w, h, 42, 16);
  textEl.setAttribute("font-size", fontSize);
  const totalH = lines.length*lineHeight;
  const startY = y + Math.max(0,(h-totalH)/2) + fontSize*0.85;
  lines.forEach((line,i)=>{
    const tspan = document.createElementNS(SVGNS,"tspan");
    tspan.setAttribute("x", cx);
    tspan.setAttribute("y", startY + i*lineHeight);
    tspan.textContent = line;
    textEl.appendChild(tspan);
  });
}

/* ---------------------------------------------------------
   APP-STATE
--------------------------------------------------------- */
const state = { sceneIndex:0, theme:"mix", texts:["",""] };

function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function randomStatement(theme){
  if(theme==="sex") return randomFrom(SEX_TEXTS);
  if(theme==="mix"){
    const all = Object.values(CATEGORY_TEXTS).flat();
    return randomFrom(all);
  }
  return randomFrom(CATEGORY_TEXTS[theme]);
}
function randomReaction(){ return randomFrom(REACTIONS); }

function pickRandomSceneIndex(excludeCurrent){
  // Plaatjes van de categorie Sex horen alleen bij die categorie, en andersom
  const wantSex = state.theme==="sex";
  const pool = SCENES.map((s,i)=>i).filter(i=>!!SCENES[i].sex===wantSex);
  if(pool.length===1) return pool[0];
  let idx;
  do{ idx=randomFrom(pool); } while(excludeCurrent && idx===state.sceneIndex);
  return idx;
}

function fillRandomTexts(){
  // De reactie in de tweede wolk is altijd willekeurig, los van categorie en uitspraak.
  state.texts=[randomStatement(state.theme), randomReaction()];
}

function renderScene(){
  const scene = SCENES[state.sceneIndex];
  const bubbleDefs = [DUO_BUBBLE_A, DUO_BUBBLE_B];
  const bubblesMarkup = bubbleDefs.map((b,i)=>bubbleGroup(b,i)).join("");
  const svg = `<svg id="scene-svg" xmlns="${SVGNS}" viewBox="0 0 800 600" width="800" height="600">
      ${scene.bg()}
      ${bubblesMarkup}
    </svg>`;
  document.getElementById("scene-frame").innerHTML = svg;
  document.getElementById("scene-title").textContent = scene.title;

  document.querySelectorAll(".bubble-text").forEach(el=>{
    const i = +el.dataset.i;
    renderBubbleText(el, state.texts[i]||"");
  });

  renderBubbleFields();
}

function renderBubbleFields(){
  const wrap = document.getElementById("bubble-fields");
  wrap.innerHTML="";
  const labels = ["Uitspraak in de linker wolk","Reactie in de rechter wolk"];
  for(let i=0;i<2;i++){
    const label=document.createElement("label");
    label.className="field-label";
    label.setAttribute("for","text-input-"+i);
    label.textContent=labels[i];
    const ta=document.createElement("textarea");
    ta.id="text-input-"+i;
    ta.maxLength=140;
    ta.value=state.texts[i]||"";
    ta.addEventListener("input",()=>{
      state.texts[i]=ta.value;
      const el=document.querySelector(`.bubble-text[data-i="${i}"]`);
      if(el) renderBubbleText(el, ta.value);
    });
    wrap.appendChild(label);
    wrap.appendChild(ta);
  }
}

function selectTheme(id, btn){
  const wasSex = state.theme==="sex";
  state.theme=id;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  btn.classList.add("active");
  if((id==="sex")!==wasSex){            // wisselen tussen Sex en de rest: ander plaatje en nieuwe tekst
    state.sceneIndex = pickRandomSceneIndex(false);
    fillRandomTexts();
    renderScene();
  }
}

/* Vragen vóór toegang tot de categorie Sex */
function openGate(onPass){
  const gate=document.getElementById("gate"), q=document.getElementById("gate-q"), btns=document.getElementById("gate-btns");
  const prevFocus=document.activeElement;
  function close(){ gate.hidden=true; document.removeEventListener("keydown",onKey); if(prevFocus&&prevFocus.focus) prevFocus.focus(); }
  function onKey(e){ if(e.key==="Escape") close(); }
  function ask(text, buttons){
    q.textContent=text; btns.innerHTML="";
    buttons.forEach((b,i)=>{
      const el=document.createElement("button"); el.type="button";
      el.className=i===0?"secondary":"ghost"; el.textContent=b[0]; el.addEventListener("click",b[1]); btns.appendChild(el);
    });
    btns.firstChild.focus();
  }
  function step1(){ ask("Ben je ouder dan 18?",[["Ja",step2],["Nee",blocked]]); }
  function step2(){ ask("Ken je de smaak van sperma?",[["Ja",pass],["Nee",pass]]); }
  function blocked(){ ask("Sorry, deze categorie is alleen voor mensen van 18 jaar en ouder.",[["Sluiten",close]]); }
  function pass(){ close(); onPass(); }
  document.addEventListener("keydown",onKey);
  gate.hidden=false; step1();
}

function renderThemeChips(){
  const wrap = document.getElementById("theme-chips");
  wrap.innerHTML="";
  THEMES.forEach(t=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="chip"+(t.sex?" sex":"")+(t.id===state.theme?" active":"");
    if(t.sex){
      btn.title="Alleen voor 18+";
      btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 1 21h22L12 2z" fill="#c1121f"/><path d="M12 9v6M12 17.5v1.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg><span>Sex</span>';
      btn.setAttribute("aria-label","Sex, alleen voor 18 jaar en ouder");
    } else btn.textContent=t.label;
    btn.addEventListener("click",()=>{
      if(t.sex){ openGate(()=>selectTheme(t.id,btn)); return; }   // elke klik op Sex: eerst de twee vragen
      selectTheme(t.id,btn);
    });
    wrap.appendChild(btn);
  });
}

   EXPORTEREN
--------------------------------------------------------- */
function getPngBlob(cb){
  const svgEl = document.getElementById("scene-svg");
  let data = new XMLSerializer().serializeToString(svgEl);
  data = data.replace(/(<svg[^>]*>)/, (m)=> m + "<style>" + FONT_CSS + "</style>");
  const blob = new Blob([data], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = function(){
    const scaleFactor=2;
    const canvas=document.createElement("canvas");
    canvas.width=800*scaleFactor; canvas.height=600*scaleFactor;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.scale(scaleFactor,scaleFactor);
    ctx.drawImage(img,0,0,800,600);
    URL.revokeObjectURL(url);
    canvas.toBlob(cb, "image/png");
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}

function downloadImage(){
  getPngBlob(blob=>{
    if(!blob){ alert("Downloaden is niet gelukt. Probeer het nog eens."); return; }
    const scene = SCENES[state.sceneIndex];
    const a=document.createElement("a");
    a.download = `tekstwolk-${scene.id}.png`;
    a.href = URL.createObjectURL(blob);
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
}

function shareImage(){
  getPngBlob(async blob=>{
    if(!blob){ alert("Delen is niet gelukt. Probeer het nog eens."); return; }
    const scene = SCENES[state.sceneIndex];
    const file = new File([blob], `tekstwolk-${scene.id}.png`, {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:"Tekstwolk", text:"Kijk wat ik heb gemaakt!"});
        return;
      }catch(e){ /* geannuleerd of mislukt: val terug op download */ }
    }
    const a=document.createElement("a");
    a.download = file.name;
    a.href = URL.createObjectURL(blob);
    document.body.appendChild(a);
    a.click();
    a.remove();
    alert("Delen wordt niet ondersteund op dit apparaat. De afbeelding is gedownload — je kunt 'm nu zelf versturen.");
  });
}

document.getElementById("btn-new-scene").addEventListener("click",()=>{
  state.sceneIndex = pickRandomSceneIndex(true);
  renderScene();
});
document.getElementById("btn-random-text").addEventListener("click",()=>{
  fillRandomTexts();
  renderScene();
});
document.getElementById("btn-download").addEventListener("click", downloadImage);
document.getElementById("btn-share").addEventListener("click", shareImage);

renderThemeChips();
state.sceneIndex = pickRandomSceneIndex(false);
fillRandomTexts();
renderScene();
// Zodra het ingebouwde lettertype klaar is: tekst opnieuw passend maken
if(document.fonts && document.fonts.load){
  document.fonts.load('bold 20px ComicNeueEmbedded').then(()=>{
    document.querySelectorAll(".bubble-text").forEach(el=>renderBubbleText(el, state.texts[+el.dataset.i]||""));
  }).catch(()=>{});
}

})();
